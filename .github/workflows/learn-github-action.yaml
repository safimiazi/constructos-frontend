# ============================================================
# ADVANCED GITHUB ACTIONS - CI/CD WORKFLOW
# ============================================================
# CONCEPTS COVERED:
#   - Triggers (on: push, pull_request, workflow_dispatch)
#   - Jobs & job dependencies (needs:)
#   - Caching (actions/cache)
#   - Matrix strategy (test on multiple Node versions)
#   - Environment secrets & variables
#   - Conditional steps (if:)
#   - Artifacts (upload/download)
#   - Deployment job (only on main branch)
# ============================================================
#
# NOTE: This workflow lives inside the constructos-frontend repo.
# GitHub checks out the repo at the workspace root directly,
# so NO working-directory prefix is needed — the root IS the frontend.
# ============================================================

name: CI/CD Pipeline
run-name: "[${{ github.ref_name }}] triggered by ${{ github.actor }}"

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"   # matches feature/anything
  pull_request:
    branches:
      - main
      - dev
  # Manual trigger from GitHub UI — useful for re-deploys
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# ============================================================
# GLOBAL ENV VARS (available to all jobs)
# ============================================================
env:
  NODE_VERSION: "20"

# ============================================================
# JOBS
# ============================================================
jobs:

  # ----------------------------------------------------------
  # JOB 1: LINT & TYPE CHECK
  # Runs first — fast feedback before expensive build
  # ----------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      # CONCEPT: Checkout your repo code into the runner workspace
      - name: Checkout code
        uses: actions/checkout@v4

      # CONCEPT: Setup Node with built-in npm cache support
      # cache-dependency-path points to package-lock.json at repo root
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      # CONCEPT: npm ci = clean install, faster & deterministic than npm install
      - name: Install dependencies
        run: npm ci

      # CONCEPT: Run ESLint
    #   - name: Run ESLint
    #     run: npm run lint

      # CONCEPT: TypeScript type check without emitting output files
      - name: TypeScript type check
        run: npx tsc --noEmit

  # ----------------------------------------------------------
  # JOB 2: BUILD (matrix strategy)
  # Tests the build on multiple Node versions in parallel
  # Waits for lint-and-typecheck to pass first
  # ----------------------------------------------------------
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck   # CONCEPT: job dependency — won't run if job 1 fails

    # CONCEPT: Matrix — runs this job N times with different configs
    strategy:
      matrix:
        node-version: ["18", "20"]
      fail-fast: true            # cancel sibling matrix jobs if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # CONCEPT: Inject secrets as env vars at build time
      # Secrets are set in: repo Settings > Secrets and variables > Actions
      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # CONCEPT: Upload build artifact — only once from the Node 20 build
      # Artifacts persist between jobs so deploy can reuse this output
      - name: Upload build artifact
        if: matrix.node-version == '20'   # CONCEPT: conditional step
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  # ----------------------------------------------------------
  # JOB 3: DEPLOY (only on main branch or manual production trigger)
  # Downloads the artifact from build job and deploys
  # ----------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build                 # waits for ALL matrix builds to pass

    # CONCEPT: Conditional job — skipped unless on main or manual prod deploy
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    # CONCEPT: GitHub Environment — enables protection rules,
    # required reviewers, and environment-scoped secrets in GitHub UI
    environment:
      name: production
      url: https://your-app.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CONCEPT: Download the artifact built by the build job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      # CONCEPT: Use secret tokens to authenticate with deployment service
      # Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # CONCEPT: if: success() / failure() — post-step conditionals
      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployed by ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment FAILED — check logs above"
